name: Deploy Web to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan Push Image MR Properti
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/michkrisma7-cmd/mrpro:latest

      - name: Build dan Push Image Migrasi
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: ghcr.io/michkrisma7-cmd/mrpro:migrate

      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 116.212.73.143
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || '22' }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 10m
          script: |
            set -eu
            cd "$HOME/web-me"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose pull
            docker pull ghcr.io/michkrisma7-cmd/mrpro:migrate
            docker run --rm --network hostme --env-file .env \
              ghcr.io/michkrisma7-cmd/mrpro:migrate
            docker compose up -d
